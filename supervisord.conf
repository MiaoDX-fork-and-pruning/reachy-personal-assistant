[unix_http_server]
file=%(here)s/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/logs/supervisor.sock

[supervisord]
nodaemon=true
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/logs/supervisord.pid

[program:viewer]
command=bash -c "uv run python %(here)s/viewer_server.py"
directory=%(here)s/bot
autostart=true
autorestart=true
stdout_logfile=%(here)s/logs/viewer.log
stderr_logfile=%(here)s/logs/viewer-error.log
priority=1

[program:reachy-daemon]
; macOS: mjpython + glfw, Linux: xvfb + egl
command=bash -c "sleep 3 && if [[ \"$(uname)\" == \"Darwin\" ]]; then MUJOCO_GL=glfw .venv/bin/mjpython -m reachy_mini.daemon.app.main --sim --no-localhost-only --websocket-uri ws://localhost:8765; else MUJOCO_GL=egl XDG_RUNTIME_DIR=/tmp/runtime-root xvfb-run -a uv run python -m reachy_mini.daemon.app.main --sim --no-localhost-only --websocket-uri ws://localhost:8765; fi"
directory=%(here)s/bot
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=10
killasgroup=true
stopasgroup=true
stdout_logfile=%(here)s/logs/reachy-daemon.log
stderr_logfile=%(here)s/logs/reachy-daemon-error.log
priority=2

[program:nat]
command=bash -c "uv run nat serve --config_file src/ces_tutorial/config.yml --port 8001 --host 0.0.0.0"
directory=%(here)s/nat
autostart=true
autorestart=true
stdout_logfile=%(here)s/logs/nat.log
stderr_logfile=%(here)s/logs/nat-error.log
priority=3
startsecs=5

[program:bot]
command=bash -c "sleep 10 && uv run python main.py --host 0.0.0.0"
directory=%(here)s/bot
autostart=true
autorestart=unexpected
stdout_logfile=%(here)s/logs/bot.log
stderr_logfile=%(here)s/logs/bot-error.log
priority=4
startsecs=15
stopwaitsecs=10
killasgroup=true
stopasgroup=true
