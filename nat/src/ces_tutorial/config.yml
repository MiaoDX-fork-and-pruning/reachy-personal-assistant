general:
  front_end:
    _type: fastapi


functions:
   wikipedia_search:
      _type: wiki_search
      max_results: 2

   router:
      _type: router
      route_config:
        - name: other
          description: Any question that requires careful thought, outside information, image understanding, or tool calling to take actions.
        - name: chit_chat
          description: Any simple chit chat, small talk, or casual conversation.
        - name: image_understanding
          description: A question that requires the assistant to see the user eg a question about their appearance, environment, scene or surroundings. Examples what am I holding, what am I wearing, what do I look like, what is in my surroundings, what does it say on the whiteboard. Questions about attire eg what color is my shirt/hat/jacket/etc


      llm_name: routing_llm

   react_agent:
      _type: react_agent
      llm_name: agent_llm
      verbose: true
      parse_agent_response_max_retries: 3
      tool_names: [wikipedia_search]

llms:
   # Agent: Large model for complex reasoning + tool calling
   # Using OpenAI-compatible API with HuggingFace endpoint
   agent_llm:
      _type: openai
      model_name: Qwen/Qwen2.5-72B-Instruct
      base_url: https://router.huggingface.co/v1
      temperature: 0.0

   # Chitchat: Balanced model for casual conversation
   chitchat_llm:
      _type: openai
      model_name: Qwen/Qwen2.5-7B-Instruct
      base_url: https://router.huggingface.co/v1
      temperature: 0.7

   # Routing: Using 7B as smallest available Qwen model via HF providers
   routing_llm:
      _type: openai
      model_name: Qwen/Qwen2.5-7B-Instruct
      base_url: https://router.huggingface.co/v1
      temperature: 0.0

   # Vision: Multimodal model for image understanding
   image_llm:
      _type: openai
      model_name: Qwen/Qwen2.5-VL-7B-Instruct
      base_url: https://router.huggingface.co/v1
      temperature: 0.0

workflow:
   _type: ces_tutorial_router_agent
   agent: react_agent
   router: router
   chitchat_llm: chitchat_llm
   image_llm: image_llm
